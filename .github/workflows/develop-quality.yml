name: Develop Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Trusted ancestor commit used for mutation targeting
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: develop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MUTATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}

jobs:
  static:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make quality-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-quality
          path: quality/**
          if-no-files-found: ignore

  backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.3
      - run: make test-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: quality/**
          if-no-files-found: ignore

  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make test-frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-tests
          path: quality/**
          if-no-files-found: ignore

  integration:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: make test-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-tests
          path: quality/**
          if-no-files-found: ignore

  backend-mutation:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.3
      - run: make mutation-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation
          path: quality/**
          if-no-files-found: ignore

  frontend-mutation:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: make mutation-frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-mutation
          path: quality/**
          if-no-files-found: ignore
